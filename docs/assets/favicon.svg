<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Desk climate station">
  <rect width="64" height="64" rx="12" fill="#121416"/>
  <!-- thermometer: temperature -->
  <rect x="14" y="12" width="8" height="32" rx="4" fill="#2a2e33" stroke="#6fcf97" stroke-width="2"/>
  <circle cx="18" cy="46" r="6.5" fill="#6fcf97"/>
  <rect x="16" y="24" width="4" height="22" rx="2" fill="#6fcf97"/>
  <!-- drop: humidity -->
  <path d="M42 12 L34.4 24.2 A9 9 0 1 0 49.6 24.2 Z" fill="#5aa9e6"/>
  <!-- sparkline: logged history -->
  <polyline points="30,53 36,47.5 41,51 47,43.5 53,46.5" fill="none" stroke="#f0c14b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
